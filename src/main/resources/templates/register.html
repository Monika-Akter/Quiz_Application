<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Teacher Registration | Online Quiz System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container narrow">
        <h1 class="center">Online Quiz System</h1>
        <div class="card">
            <h2>Create a Teacher Account</h2>

            <div class="alert alert-error" th:if="${error}" th:text="${error}"></div>

            <form th:action="@{/register}" method="post">
                <label for="fullName">Full Name</label>
                <input id="fullName" name="fullName" th:value="${fullName}" required>

                <label for="username">Username</label>
                <input id="username" name="username" th:value="${username}" required>

                <label for="password">Password (minimum 6 characters)</label>
                <input id="password" type="password" name="password" required>

                <label for="accessCode">Teacher Access Code</label>
                <input id="accessCode" type="password" name="accessCode" required>

                <br><br>
                <button type="submit">Register</button>
            </form>
            <p class="muted">Already have an account? <a href="/login">Sign in</a></p>
        </div>
    </div>
</body>
</html>
