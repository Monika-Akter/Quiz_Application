<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz in Progress | Online Quiz System</title>
    <meta http-equiv="refresh" th:attr="content=|${secondsLeft};url=/student/quizzes/${quiz.id}/question|">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>
        body {
            -webkit-user-select: none;
            user-select: none;
        }
        .bar {
            height: 12px;
            background: #e5e7eb;
            border-radius: 6px;
            overflow: hidden;
            margin: 10px 0 20px;
        }
        .fill {
            height: 100%;
            background: #2563eb;
            width: 100%;
            animation-name: shrink;
            animation-timing-function: linear;
            animation-fill-mode: forwards;
        }
        @keyframes shrink {
            from { width: 100%; }
            to { width: 0; }
        }
        .opt {
            display: block;
            width: 100%;
            text-align: left;
            padding: 14px;
            margin: 10px 0;
            font-size: 16px;
            background: #fff;
            color: #1f2937;
            border: 1px solid #cbd5e1;
        }
        .opt:hover { background: #eff6ff; }
    </style>
</head>
<body>
    <header class="topbar">
        <span class="brand">Online Quiz System</span>
        <span th:text="${quiz.title}"></span>
    </header>

    <div class="container">
        <div class="card">
            <p class="muted">
                Question <b th:text="${number}"></b> of <b th:text="${total}"></b>
                &nbsp;|&nbsp; Time remaining: <b th:text="${secondsLeft}"></b> seconds
            </p>
            <div class="bar">
                <div class="fill" th:style="|animation-duration:${secondsLeft}s|"></div>
            </div>

            <h2 th:text="${question.text}"></h2>

            <form th:action="@{/student/quizzes/{id}/answer(id=${quiz.id})}" method="post">
                <button class="opt" type="submit" name="answer" value="A" th:text="${'A) ' + question.optionA}"></button>
                <button class="opt" type="submit" name="answer" value="B" th:text="${'B) ' + question.optionB}"></button>
                <button class="opt" type="submit" name="answer" value="C" th:text="${'C) ' + question.optionC}"></button>
                <button class="opt" type="submit" name="answer" value="D" th:text="${'D) ' + question.optionD}"></button>
            </form>

            <p class="muted">
                Select an option to submit your answer. If the time expires, the question will be skipped
                and no marks will be awarded.
            </p>
        </div>
    </div>
</body>
</html>
