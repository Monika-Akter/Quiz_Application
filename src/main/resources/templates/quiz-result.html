<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz Result | Online Quiz System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <header class="topbar">
        <span class="brand">Online Quiz System</span>
    </header>

    <div class="container narrow">
        <div class="card center">
            <h2>Quiz Completed</h2>
            <p class="muted" th:text="${quiz.title}"></p>
            <h1 th:text="${score + ' / ' + total}"></h1>
            <p>Your score: <b th:text="${(total > 0 ? score * 100 / total : 0) + '%'}"></b></p>
            <p class="muted">This result is shown only once and cannot be viewed again.</p>
            <div class="actions" style="justify-content:center">
                <a class="btn" href="/student/quizzes">Take Another Quiz</a>
                <a class="btn btn-secondary" href="/student/exit">Finish</a>
            </div>
        </div>
    </div>
</body>
</html>
