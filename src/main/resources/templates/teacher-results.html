<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Quiz Results | Online Quiz System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <style>.container { max-width: 1100px; }</style>
</head>
<body>
    <header class="topbar">
        <span class="brand">Online Quiz System</span>
        <form th:action="@{/logout}" method="post">
            <button class="btn-light" type="submit">Sign Out</button>
        </form>
    </header>

    <div class="container">
        <p><a href="/quizzes">&larr; Back to Dashboard</a></p>
        <h1>Results: <span th:text="${quiz.title}"></span></h1>

        <div class="card">
            <p class="muted" th:if="${attempts.isEmpty()}">No students have attempted this quiz yet.</p>
            <table th:unless="${attempts.isEmpty()}">
                <tr>
                    <th>Name</th>
                    <th>Student ID</th>
                    <th>University</th>
                    <th>Department</th>
                    <th>Batch</th>
                    <th>Score</th>
                    <th>%</th>
                    <th>Date</th>
                </tr>
                <tr th:each="a : ${attempts}">
                    <td th:text="${a.studentName}"></td>
                    <td th:text="${a.studentNo}"></td>
                    <td th:text="${a.university}"></td>
                    <td th:text="${a.department}"></td>
                    <td th:text="${a.batch}"></td>
                    <td th:text="${a.score + ' / ' + a.total}"></td>
                    <td th:text="${(a.total > 0 ? a.score * 100 / a.total : 0) + '%'}"></td>
                    <td th:text="${#temporals.format(a.takenAt, 'dd MMM yyyy, HH:mm')}"></td>
                </tr>
            </table>
        </div>
    </div>
</body>
</html>
