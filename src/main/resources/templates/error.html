<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Error | Online Quiz System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
    <div class="container narrow">
        <div class="card center">
            <h1 th:text="${status}">Error</h1>
            <p th:if="${status == 404}">The page you requested could not be found.</p>
            <p th:if="${status == 403}">You do not have permission to access this page.</p>
            <p th:if="${status != 404 and status != 403}">
                An unexpected error occurred. Please try again later.
            </p>
            <a class="btn" href="/">Return to Home</a>
        </div>
    </div>
</body>
</html>
